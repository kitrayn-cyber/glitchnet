<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>GlitchNet avatar review</title><style>body{margin:0;background:#160e1e;color:white;font:16px system-ui}main{max-width:1100px;margin:auto;padding:24px}h1,h2{color:#ff80c6}p{line-height:1.5}fieldset{border:2px solid #ff80c6;margin:12px 0;padding:14px}legend{color:#caff42;font-weight:bold}label{display:inline-flex;gap:8px;align-items:center;margin:4px 12px 4px 0}select,button{font:inherit;padding:8px}.panels{display:flex;flex-wrap:wrap;gap:20px}figure{margin:0}canvas{background:#29213c;border:3px solid #ff80c6;image-rendering:pixelated}#portrait{width:min(390px,85vw);height:auto}#sprite{width:240px;height:auto}figcaption{padding:8px 0}a{color:#bfff62}</style></head><body><main><h1>Avatar interactive review</h1><p>Local working preview using the portrait and room renderer. These controls do not save or change your avatar. Palette and masking work remains under review.</p><fieldset><legend>Appearance</legend><label>Hair <select id="hair"></select></label><label>Skin <select id="skin"></select></label><label>Eyes <select id="eyes"></select></label></fieldset><fieldset><legend>Pose</legend><label><input type="checkbox" id="blink"> Eyes closed</label><label><input type="checkbox" id="walk"> Animate walking</label><label>Direction <select id="direction"><option value="0">Front</option><option value="1">Left</option><option value="2">Back</option><option value="3">Right</option></select></label></fieldset><section class="panels"><figure><canvas id="portrait" width="320" height="320"></canvas><figcaption>Profile portrait</figcaption></figure><figure><canvas id="sprite" width="150" height="164"></canvas><figcaption>Room sprite</figcaption></figure></section><p><a href="palette-review.html">Open the full comparison gallery</a> · <a href="../home.html">Homepage preview</a> · <a href="../avatar.html">Avatar studio preview</a> · <a href="../room.html?artPreview=1">Room preview</a></p></main><script type="module">
import {drawPortrait} from '../assets/avatar/portrait.js?v=7';
import {tintArtwork} from '../assets/avatar/artwork.js?v=4';
import {composeRoomBlink} from '../assets/avatar/room-blink.js?v=1';
const $=s=>document.querySelector(s);for(const [id,names] of Object.entries({hair:['Black','Brown','Copper','Blonde','Silver','Pink','Blue'],skin:['Tone 1','Tone 2','Tone 3','Tone 4','Tone 5','Tone 6'],eyes:['Blue','Brown','Green','Violet','Dark']})) names.forEach((name,i)=>$("#"+id).add(new Option(name,i)));$('#hair').value='5';
const load=src=>new Promise((res,rej)=>{let im=new Image();im.onload=()=>res(im);im.onerror=rej;im.src=src});const [sheet,closedSheet,guide,openMask,closedMask]=await Promise.all(['walk-sheet.png','walk-blink.png','walk-hair-mask.png','walk-color-mask.png','walk-blink-color-mask.png'].map(n=>load('../assets/avatar/art/'+n)));
let roomOpen,roomClosed,frame=0;const motion=matchMedia('(prefers-reduced-motion: reduce)');
function state(){return {hairColor:+$('#hair').value,skin:+$('#skin').value,eyes:+$('#eyes').value}}
function prepare(){const s=state();roomOpen=tintArtwork(sheet,s,'room',guide,sheet,openMask);const closed=tintArtwork(closedSheet,s,'room',guide,sheet,closedMask);roomClosed=composeRoomBlink(roomOpen,closed,sheet,guide,openMask);paint()}
function paint(){drawPortrait($('#portrait').getContext('2d'),state(),{blink:$('#blink').checked});const ctx=$('#sprite').getContext('2d');ctx.clearRect(0,0,150,164);ctx.imageSmoothingEnabled=false;ctx.drawImage($('#blink').checked?roomClosed:roomOpen,frame*150,+$('#direction').value*164,150,164,0,0,150,164)}
for(const id of ['hair','skin','eyes'])$('#'+id).addEventListener('change',prepare);for(const id of ['blink','direction'])$('#'+id).addEventListener('change',paint);$('#walk').addEventListener('change',paint);setInterval(()=>{if($('#walk').checked&&!motion.matches){frame=(frame+1)%4;paint()}},240);prepare();
</script></body></html>
