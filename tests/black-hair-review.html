<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Black hair comparison</title><style>body{background:#17111f;color:#fff;font:16px system-ui;margin:24px}h1,h2{color:#ff8acb}.row{display:flex;gap:20px;flex-wrap:wrap}figure{margin:0}canvas{width:min(400px,88vw);height:auto;aspect-ratio:1;image-rendering:pixelated;background:#29213c;border:3px solid #f58bc4}figcaption{padding:8px}a{color:#caff55}</style></head><body><h1>Black hair: open and closed eyes</h1><p>Actual portrait renderer. Compare each skin tone and both blink states at enlarged scale.</p><div id="gallery"></div><p><a href="avatar-interactive-review.html">Interactive color and room preview</a></p><script type="module">
import {drawPortrait} from '../assets/avatar/portrait.js?v=7';
for(let skin=0;skin<6;skin++){const h=document.createElement('h2'),row=document.createElement('div');h.textContent='Skin tone '+(skin+1);row.className='row';for(const blink of [false,true]){let f=document.createElement('figure'),c=document.createElement('canvas'),label=document.createElement('figcaption');c.width=c.height=320;drawPortrait(c.getContext('2d'),{skin,hairColor:0,eyes:0},{blink});label.textContent=blink?'Eyes closed':'Eyes open';f.append(c,label);row.append(f)}document.querySelector('#gallery').append(h,row)}
</script></body></html>
