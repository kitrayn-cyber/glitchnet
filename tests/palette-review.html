<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Avatar palette comparison</title><style>body{background:#17111f;color:#fff;font:16px system-ui;margin:24px}p{max-width:75ch}.gallery{display:flex;gap:18px;flex-wrap:wrap}figure{margin:0}canvas{width:min(320px,88vw);height:auto;aspect-ratio:1;image-rendering:pixelated;background:#29213c;border:3px solid #f58bc4}figcaption{padding:8px}h2{color:#ccff55;margin-top:36px}</style></head><body><h1>Avatar palette comparison</h1><p>Actual portrait renderer, enlarged. This is a local work-in-progress preview; the approved artwork and framing remain the reference.</p><h2>Hair colors</h2><div id="hair" class="gallery"></div><h2>Skin tones</h2><div id="skin" class="gallery"></div><h2>Eye colors</h2><div id="eyes" class="gallery"></div><h2>Open and blink</h2><div id="blink" class="gallery"></div><script type="module">
import {drawPortrait} from '../assets/avatar/portrait.js?v=7';
function add(group,label,state,blink=false){const f=document.createElement('figure'),c=document.createElement('canvas'),caption=document.createElement('figcaption');c.width=c.height=320;drawPortrait(c.getContext('2d'),state,{blink});caption.textContent=label;f.append(c,caption);document.querySelector('#'+group).append(f)}
for(const [hairColor,label] of ['Black','Brown','Copper','Blonde','Silver','Pink','Blue'].entries())add('hair',label,{skin:0,hairColor,eyes:0});
for(let skin=0;skin<6;skin++)add('skin','Tone '+(skin+1),{skin,hairColor:0,eyes:0});
for(const [eyes,label] of ['Blue','Brown','Green','Violet','Dark'].entries())add('eyes',label,{skin:0,hairColor:5,eyes});
for(const blink of [false,true])add('blink',blink?'Closed':'Open',{skin:4,hairColor:0,eyes:0},blink);
</script></body></html>
<h2>Room sprite — front and side</h2><div id="room" class="gallery"></div><script type="module">
import {tintArtwork} from '../assets/avatar/artwork.js?v=4';
const load=src=>new Promise((resolve,reject)=>{const i=new Image();i.onload=()=>resolve(i);i.onerror=reject;i.src=src});
const [sheet,guide,mask]=await Promise.all([load('../assets/avatar/art/walk-sheet.png'),load('../assets/avatar/art/walk-hair-mask.png'),load('../assets/avatar/art/walk-color-mask.png')]);
for(const [skin,hairColor,label] of [[0,5,'Pink hair · tone 1'],[0,0,'Black hair · tone 1'],[2,0,'Black hair · tone 3'],[3,0,'Black hair · tone 4'],[4,0,'Black hair · tone 5']])for(const [row,direction] of [[0,'front'],[1,'side']]){let source=tintArtwork(sheet,{skin,hairColor,eyes:0},'room',guide,sheet,mask),figure=document.createElement('figure'),c=document.createElement('canvas'),cap=document.createElement('figcaption');c.width=150;c.height=164;c.style.width='240px';c.style.height='262px';let ctx=c.getContext('2d');ctx.imageSmoothingEnabled=false;ctx.drawImage(source,0,row*164,150,164,0,0,150,164);cap.textContent=label+' · '+direction;figure.append(c,cap);document.querySelector('#room').append(figure)}
</script>
