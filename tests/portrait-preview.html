<!doctype html><meta charset="utf-8"><title>Portrait blink test</title><style>body{background:#1a1120;color:white;font:16px sans-serif}#gallery{display:flex;gap:12px;flex-wrap:wrap}canvas{width:160px;height:160px;image-rendering:pixelated;background:#29213c}button{padding:12px}</style><h1>Portrait blink verification</h1><button id="run">Run all color combinations</button><p id="result">Not run</p><div id="gallery"></div><script type="module">
import {drawPortrait} from '../assets/avatar/portrait.js?v=5';import {isEyeRegion} from '../assets/avatar/blink.js';
function render(s,blink){const c=document.createElement('canvas');c.width=c.height=320;drawPortrait(c.getContext('2d'),s,{blink});return c}
for(const s of [{skin:0,hairColor:5,eyes:0},{skin:4,hairColor:0,eyes:2},{skin:2,hairColor:6,eyes:4}])for(const blink of [false,true])document.querySelector('#gallery').append(render(s,blink));
document.querySelector('#run').onclick=()=>{let checked=0,outside=0,noChange=0;for(let skin=0;skin<6;skin++)for(let hairColor=0;hairColor<7;hairColor++)for(let eyes=0;eyes<5;eyes++){let s={skin,hairColor,eyes},a=render(s,false).getContext('2d').getImageData(0,0,320,320).data,b=render(s,true).getContext('2d').getImageData(0,0,320,320).data,diff=0;for(let y=0;y<320;y++)for(let x=0;x<320;x++){let i=(y*320+x)*4;if(a[i]!==b[i]||a[i+1]!==b[i+1]||a[i+2]!==b[i+2]||a[i+3]!==b[i+3]){diff++;if(!isEyeRegion(x,y))outside++}}if(!diff)noChange++;checked++}document.querySelector('#result').textContent=`${checked} combinations; ${outside} changed pixels outside eye regions; ${noChange} missing blinks`;};
</script>
