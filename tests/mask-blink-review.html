<!doctype html><meta charset="utf-8"><title>Blink mask review</title><style>body{background:#1a1120;color:white;font:16px Verdana}#gallery{display:flex;gap:12px;flex-wrap:wrap}canvas{width:300px;height:auto;image-rendering:pixelated;background:#29213c;border:2px solid #ed8ac0}label{display:block;text-align:center}</style><h1>Open and closed, across palettes</h1><div id="gallery"></div><script type="module">import {drawPortrait} from '../assets/avatar/portrait.js?v=6';for(const [name,s] of [['Pink',{skin:0,hairColor:5,eyes:0}],['Black',{skin:4,hairColor:0,eyes:2}],['Blue',{skin:2,hairColor:6,eyes:4}]])for(const blink of [false,true]){const original=document.createElement('canvas');original.width=original.height=320;drawPortrait(original.getContext('2d'),s,{blink});const c=document.createElement('canvas');c.width=118;c.height=50;c.getContext('2d').drawImage(original,122,99,118,50,0,0,118,50);const l=document.createElement('label');l.textContent=name+' '+(blink?'closed':'open');l.append(document.createElement('br'),c);document.getElementById('gallery').append(l)}</script>
