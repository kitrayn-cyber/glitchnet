<!doctype html><meta charset="utf-8"><title>Avatar mask checks</title><style>body{background:#17111f;color:#fff;font:16px Verdana,sans-serif}#gallery{display:flex;gap:8px;flex-wrap:wrap}canvas{width:150px;height:150px;image-rendering:pixelated;background:#29213c;border:2px solid #f58bc4}canvas#mask{width:320px;height:320px}label{display:block;text-align:center}button{padding:12px}</style><h1>Hair colors and tint verification</h1><div id="gallery"></div><h2>Skin tones</h2><div id="skin-gallery" style="display:flex;gap:8px;flex-wrap:wrap"></div><h2>Eye colors</h2><div id="eye-gallery" style="display:flex;gap:8px;flex-wrap:wrap"></div><div><label>Selected hair pixels</label><canvas id="mask" width="320" height="320"></canvas></div><button id="run">Run all color combinations</button><p id="result">Not run</p><script type="module">
import {drawPortrait} from '../assets/avatar/portrait.js?v=7';import {createHairMask} from '../assets/avatar/artwork.js?v=4';import {isEyeRegion} from '../assets/avatar/blink.js?v=4';
const load=src=>new Promise((resolve,reject)=>{let i=new Image();i.onload=()=>resolve(i);i.onerror=reject;i.src=src});const [base,reference,selections]=await Promise.all([load('../assets/avatar/art/portrait-open.png'),load('../assets/avatar/art/portrait-hair-mask.png'),load('../assets/avatar/art/portrait-color-mask.png')]);const mask=createHairMask(base,reference,320,320,selections);const mctx=document.getElementById('mask').getContext('2d');mctx.imageSmoothingEnabled=false;mctx.drawImage(base,0,0,320,320);const overlay=mctx.createImageData(320,320);for(let n=0;n<mask.length;n++)if(mask[n]){let i=n*4;overlay.data[i]=0;overlay.data[i+1]=255;overlay.data[i+2]=0;overlay.data[i+3]=200;}mctx.putImageData(overlay,0,0);
function render(s,blink){let c=document.createElement('canvas');c.width=c.height=320;drawPortrait(c.getContext('2d'),s,{blink});return c}for(let hairColor=0;hairColor<7;hairColor++){let l=document.createElement('label');l.textContent=['Black','Brown','Copper','Blonde','Silver','Pink','Blue'][hairColor];l.append(document.createElement('br'),render({skin:2,eyes:0,hairColor},false));document.querySelector('#gallery').append(l)}
for(let skin=0;skin<6;skin++){let l=document.createElement('label');l.textContent='Tone '+(skin+1);l.append(document.createElement('br'),render({skin,eyes:0,hairColor:5},false));document.querySelector('#skin-gallery').append(l)}for(let eyes=0;eyes<5;eyes++){let l=document.createElement('label');l.textContent=['Blue','Brown','Green','Violet','Dark'][eyes];l.append(document.createElement('br'),render({skin:0,eyes,hairColor:5},false));document.querySelector('#eye-gallery').append(l)}
document.querySelector('#run').onclick=()=>{let combos=0,outsideHair=0,outsideEyes=0,hairBlink=0,neckChanges=0,missing=0;for(let skin=0;skin<6;skin++)for(let eyes=0;eyes<5;eyes++){let baseline=render({skin,eyes,hairColor:5},false).getContext('2d').getImageData(0,0,320,320).data;for(let hairColor=0;hairColor<7;hairColor++){let s={skin,eyes,hairColor},a=render(s,false).getContext('2d').getImageData(0,0,320,320).data,b=render(s,true).getContext('2d').getImageData(0,0,320,320).data,diff=0;for(let n=0;n<mask.length;n++){let i=n*4;if(!mask[n]&&(a[i]!==baseline[i]||a[i+1]!==baseline[i+1]||a[i+2]!==baseline[i+2]||a[i+3]!==baseline[i+3]))outsideHair++;if(a[i]!==b[i]||a[i+1]!==b[i+1]||a[i+2]!==b[i+2]||a[i+3]!==b[i+3]){diff++;if(mask[n])hairBlink++;if(!isEyeRegion(n%320,Math.floor(n/320)))outsideEyes++}if([[160,190],[152,180],[155,210]].some(([x,y])=>n===y*320+x)&&(a[i]!==baseline[i]||a[i+1]!==baseline[i+1]||a[i+2]!==baseline[i+2]))neckChanges++}if(!diff)missing++;combos++}}document.querySelector('#result').textContent=`${combos} combinations: ${outsideHair} pixels changed outside hair mask; ${outsideEyes} blink changes outside eyes; ${hairBlink} hair pixel blink changes; ${neckChanges} protected neck shadow changes; ${missing} missing blinks.`};
</script>
